<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style/all.css" />
  </head>
  <body>
    <header class="py-3 border-bottom border-neutral-85">
      <ul
        class="container list-unstyled d-flex justify-content-between align-items-center"
      >
        <!-- 品牌標誌 -->
        <li>
          <a href="./index.html">
            <img src="./img/logo.png" alt="品牌標誌" />
          </a>
        </li>
        <!-- 選單 -->
        <li class="d-none d-md-flex">
          <nav>
            <ul class="list-unstyled d-flex gap-3">
              <li>
                <a class="py-2 px-6 fw-normal" href="./service.html"
                  >服務方案</a
                >
              </li>
              <li>
                <a class="py-2 px-6" href="./about.html">關於職旅</a>
              </li>
              <li>
                <a class="py-2 px-6" href="＃">聯絡我們</a>
              </li>
            </ul>
          </nav>
        </li>
        <!-- 登入註冊 -->
        <li>
          <a
            class="btn btn-xl px-md-6 px-4 btn-white-filled me-3 me-md-0"
            href="#"
            >登入/註冊</a
          >

          <button class="btn py-3 px-0 border-0 d-md-none">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="currentColor"
            >
              <path
                d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
              />
            </svg>
          </button>
        </li>
      </ul>
    </header>
    <main class="py-9">
      <section class="container d-flex radius-4 shadow px-0 flex-row-reverse">
        <!-- 圖片 -->

        <img
          class="max-width-9 radius-top-end radius-bottom-end d-none d-xl-flex"
          src="./img/about/register.png"
          alt="品牌形象圖"
        />
        <!-- 表單 -->
        <div class="p-9 p-6 flex-grow-1">
          <form class="d-flex flex-column gap-sm-9 gap-6" action="">
            <!-- 標題 -->
            <h2 class="text-center">註冊</h2>
            <!-- google、discord、帳號、密碼 -->
            <div>
              <!-- google、discord -->
              <div
                class="d-flex flex-column gap-4 border-bottom border-neutral-85 pb-6"
              >
                <button
                  class="btn py-3 d-flex justify-content-center align-items-center gap-1 w-100 border border-neutral-85 radius-3"
                >
                  <span>
                    <img src="./img/icon/google.png" alt="google" />
                  </span>
                  <span>Google</span>
                </button>
                <button
                  class="btn py-3 d-flex justify-content-center align-items-center gap-1 w-100 border border-neutral-85 radius-3"
                >
                  <span>
                    <img src="./img/icon/discord.png" alt="discord" />
                  </span>
                  <span>Discord</span>
                </button>
              </div>
              <!-- 帳號、密碼 -->
              <div class="d-flex flex-column gap-4">
                <!-- 帳號 -->
                <div class="pt-6">
                  <input
                    type="email"
                    id="account"
                    class="form-control py-4 border-neutral-85"
                    aria-describedby="accountBlock"
                    placeholder="帳號"
                  />
                </div>
                <!-- 密碼 -->
                <div class="position-relative">
                  <input
                    type="password"
                    id="password"
                    class="form-control py-4 border-neutral-85"
                    aria-describedby="passwordBlock"
                    placeholder="密碼"
                  />
                  <span>
                    <img
                      class="position-absolute top-50 end-12 translate-middle-y"
                      src="./img/icon/visibility.png"
                      alt="隱藏"
                    />
                  </span>
                </div>
                <!-- 密碼 -->
                <div class="position-relative">
                  <input
                    type="password"
                    id="password"
                    class="form-control py-4 border-neutral-85"
                    aria-describedby="passwordBlock"
                    placeholder="密碼"
                  />
                  <span>
                    <img
                      class="position-absolute top-50 end-12 translate-middle-y"
                      src="./img/icon/visibility.png"
                      alt="隱藏"
                    />
                  </span>
                </div>
                <!-- 確認密碼 -->
                <div class="position-relative">
                  <input
                    type="password"
                    id="password"
                    class="form-control py-4 border-neutral-85"
                    aria-describedby="passwordBlock"
                    placeholder="確認密碼"
                  />
                  <span>
                    <img
                      class="position-absolute top-50 end-12 translate-middle-y"
                      src="./img/icon/visibility.png"
                      alt="隱藏"
                    />
                  </span>
                </div>
                <!-- 同意 -->
                <div class="form-check d-flex align-items-center gap-1 mb-0">
                  <!-- 核取方塊 -->
                  <input
                    class="form-check-input border-neutral-85 height-2 width-1"
                    type="checkbox"
                    value="平日上午(9:00-12:00)"
                    id="checkDefault"
                  />
                  <label
                    class="form-check-label fs-8 fw-normal d-flex justify-content-center align-items-center"
                    for="checkDefault"
                  >
                    我同意
                    <a class="d-flex align-items-center gap-1" href="#">
                      <span
                        class="text-brand-primary fw-medium lh-1p2 text-decoration-underline"
                      >
                        服務條款
                      </span>
                    </a>
                    和
                    <a class="d-flex align-items-center gap-1" href="#">
                      <span
                        class="text-brand-primary fw-medium lh-1p2 text-decoration-underline"
                      >
                        服務條款
                      </span>
                    </a>
                  </label>
                </div>

                <!-- CTA -->
                <a class="btn btn-large btn-black-filled" href="#">
                  <span class="fs-7 fw-normal">送出</span>
                  <span>
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      height="28px"
                      viewBox="0 -960 960 960"
                      width="28px"
                      fill="currentColor"
                    >
                      <path
                        d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"
                      />
                    </svg>
                  </span>
                </a>
              </div>
            </div>
            <!-- 登入 -->
            <a href="#" class="text-center">
              <span class="text-neutral-50 fw-medium lh-1p2">已經會員？</span>
              <span
                class="text-brand-primary fw-medium lh-1p2 text-decoration-underline"
                >直接登入</span
              >
            </a>
          </form>
        </div>
      </section>
    </main>
    <footer class="py-sm-9 py-6 bg-neutral-95 border-top border-neutral-85">
      <!-- 選單、版權 -->
      <ul
        class="list-unstyled container d-flex justify-content-between align-items-center flex-xl-row flex-column gap-2 gap-sm-0"
      >
        <!-- 選單 -->
        <li>
          <ul
            class="list-unstyled d-flex justify-content-sm-between justify-content-center flex-wrap gap-2 gap-sm-0"
          >
            <li class="flex-shrink-0">
              <a
                class="py-2 px-sm-6 px-4 fw-normal fw-normal"
                href="./service.html"
                >服務方案</a
              >
            </li>
            <li class="flex-shrink-0">
              <a class="py-2 px-6 fw-normal" href="./about.html">關於職旅</a>
            </li>
            <li class="flex-shrink-0">
              <a class="py-2 px-6 fw-normal" href="#">聯絡我們</a>
            </li>
            <li class="flex-shrink-0">
              <a class="py-2 px-6 fw-normal" href="#">隱私權政策</a>
            </li>
            <li class="flex-shrink-0">
              <a class="py-2 px-6 fw-normal" href="#">用戶條款</a>
            </li>
          </ul>
        </li>
        <!-- 版權 -->
        <li class="fs-8 text-neutral-50">
          Copyright © 2025 職旅 workway. All rights reserved.
        </li>
      </ul>
    </footer>
    <script src="./modules/bootstrap-5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
